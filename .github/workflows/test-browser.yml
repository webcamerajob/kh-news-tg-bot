name: Test Browser CF Challenge

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Target URL to test"
        required: false
        default: "https://www.khmertimeskh.com/category/national/"
      wait_sec:
        description: "Seconds to wait for challenge"
        required: false
        default: "12"

jobs:
  test-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install xvfb & dependencies
        run: |
          sudo apt-get update -o Acquire::Languages=none -qq
          sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libx11-xcb1 libasound2t64 || sudo apt-get install -y --no-install-recommends xvfb libgtk-3-0 libx11-xcb1 libasound2

      - name: Install camoufox and fetch browser
        run: |
          pip install --prefer-binary camoufox
          camoufox fetch

      - name: Run browser test
        env:
          TEST_URL: ${{ github.event.inputs.url || 'https://www.khmertimeskh.com/category/national/' }}
          TEST_WAIT_SEC: ${{ github.event.inputs.wait_sec || '12' }}
        run: xvfb-run -a python3 test_browser.py
