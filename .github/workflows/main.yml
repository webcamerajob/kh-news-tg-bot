      - name: Set up Python
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip' # 🚀 Кэширует pip-пакеты между запусками

      - name: Install FFmpeg (Fast Static Build)
        if: steps.guard.outputs.skip != 'true'
        run: |
          # 🚀 Скачивает готовый бинарник за секунды вместо установки 99 тяжелых пакетов через apt
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-*-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-static/ffprobe /usr/local/bin/
          rm -rf ffmpeg.tar.xz ffmpeg-*-static

      - name: Install requirements
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          # Убрали --no-cache-dir, чтобы работал кэш actions/setup-python
          pip install curl_cffi requests beautifulsoup4 yt-dlp
          [ -f requirements-parser.txt ] && pip install -r requirements-parser.txt || true
          [ -f requirements-poster.txt ] && pip install -r requirements-poster.txt || true
          [ -f requirements-video.txt ] && pip install -r requirements-video.txt || true
